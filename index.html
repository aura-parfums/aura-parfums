<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دار العطور الفاخرة | Luxury Perfumes</title>
    
    <!-- استدعاء خط Readex Pro الفاخر -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        /* التنسيقات العامة */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Readex Pro', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #f5f5f5;
            line-height: 1.6;
        }

        /* الهيدر */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 8%;
            background: rgba(11, 11, 11, 0.95);
            border-bottom: 1px solid rgba(212, 175, 55, 0.2);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .logo-img {
            height: 75px;
            width: auto;
            object-fit: contain;
            display: block;
            border-radius: 4px;
            transition: transform 0.3s ease;
        }

        .logo-img:hover {
            transform: scale(1.05);
        }

        nav a {
            color: #ccc;
            text-decoration: none;
            margin-right: 20px;
            transition: 0.3s;
        }

        nav a:hover {
            color: #d4af37;
        }

        /* حاوية الصفحات */
        .container {
            max-width: 1200px;
            margin: 120px auto 50px;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            font-size: 32px;
            color: #d4af37;
            margin-bottom: 40px;
            letter-spacing: 1px;
            font-weight: 700;
        }

        /* شبكة المنتجات */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 30px;
        }

        .product-card {
            background: #141414;
            border: 1px solid #282828;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            transition: 0.3s;
        }

        .product-card:hover {
            border-color: #d4af37;
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.15);
        }

        .product-card img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .product-card h3 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .product-card .price {
            color: #d4af37;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .btn-gold {
            display: inline-block;
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #d4af37 0%, #f3e5ab 50%, #aa7c11 100%);
            color: #000;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            text-align: center;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.2);
        }

        .btn-gold:hover {
            opacity: 0.95;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(212, 175, 55, 0.4);
        }

        /* ==================== نافذة الطلب الفاخرة (MODAL) ==================== */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .modal-overlay.active {
            display: flex;
        }

        .order-section {
            background: linear-gradient(145deg, #181818, #0e0e0e);
            border: 1px solid rgba(212, 175, 55, 0.4);
            border-radius: 16px;
            padding: 35px;
            width: 100%;
            max-width: 480px;
            position: relative;
            box-shadow: 0 0 35px rgba(212, 175, 55, 0.25), inset 0 0 15px rgba(212, 175, 55, 0.05);
            animation: modalPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { opacity: 0; transform: scale(0.85); }
            to { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 26px;
            color: #888;
            cursor: pointer;
            transition: 0.3s;
            line-height: 1;
        }

        .close-btn:hover {
            color: #d4af37;
            transform: rotate(90deg);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .modal-header h2 {
            font-size: 22px;
            color: #d4af37;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .modal-header p {
            font-size: 13px;
            color: #888;
            margin-top: 4px;
        }

        .form-group {
            margin-bottom: 18px;
            text-align: right;
        }

        .form-group label {
            display: block;
            color: #d4af37;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 500;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 13px 15px;
            background: #080808;
            border: 1px solid #333;
            color: #fff;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .form-group input::placeholder,
        .form-group textarea::placeholder {
            color: #555;
        }

        .form-group input:focus, 
        .form-group select:focus, 
        .form-group textarea:focus {
            outline: none;
            border-color: #d4af37;
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            background: #0d0d0d;
        }

        /* زر الواتساب الفاخر */
        .btn-whatsapp {
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #fff;
            font-size: 15px;
            font-weight: 700;
            border: none;
            border-radius: 8px;
            padding: 14px;
            width: 100%;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-whatsapp:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(37, 211, 102, 0.5);
            background: linear-gradient(135deg, #28e16d 0%, #149b8c 100%);
        }

        /* التجاوب مع الهواتف */
        @media (max-width: 768px) {
            header {
                padding: 10px 5%;
            }
            .logo-img {
                height: 58px;
            }
            .container {
                margin-top: 100px;
            }
            .order-section {
                padding: 25px 20px;
            }
        }
    </style>
</head>
<body>

    <!-- الشريط العلوي -->
    <header>
        <a href="#">
            <img src="Adobe Express - file.png" alt="A&P AURA PARFUMS" class="logo-img">
        </a>
        <nav>
            <a href="#products">المنتجات</a>
        </nav>
    </header>

    <div class="container">
        <!-- قسم معرض المنتجات -->
        <section id="products">
            <h2 class="section-title">المجموعة الفاخرة</h2>
            <div class="products-grid">
                
                <!-- منتج 1 -->
                <div class="product-card">
                    <img src="parfum1.jpg" alt="1 MILLION">
                    <h3>1 MILLION</h3>
                    <div class="price">45 درهم</div>
                    <button class="btn-gold" onclick="openOrderModal('1 MILLION')">اطلب الآن</button>
                </div>

                <!-- منتج 2 -->
                <div class="product-card">
                    <img src="parfum4.jpg" alt="ULTRA MALE">
                    <h3>ULTRA MALE</h3>
                    <div class="price">45 درهم</div>
                    <button class="btn-gold" onclick="openOrderModal('ULTRA MALE')">اطلب الآن</button>
                </div>

                <!-- منتج 3 -->
                <div class="product-card">
                    <img src="parfum3.jpg" alt="IMAGINATION LOUIS VUITTON">
                    <h3>IMAGINATION LOUIS VUITTON</h3>
                    <div class="price">45 درهم</div>
                    <button class="btn-gold" onclick="openOrderModal('IMAGINATION LOUIS VUITTON')">اطلب الآن</button>
                </div>

            </div>
        </section>
    </div>

    <!-- نافذة استمارة الطلب المنبثقة الفاخرة -->
    <div id="orderModal" class="modal-overlay" onclick="closeOnOverlay(event)">
        <section class="order-section">
            <span class="close-btn" onclick="closeOrderModal()">&times;</span>
            
            <div class="modal-header">
                <h2>استمارة الطلب المباشر</h2>
                <p>تأكيد طلبك وتوصيله حتى باب منزلك</p>
            </div>
            
            <form id="whatsappForm">
                <div class="form-group">
                    <label>✨ العطر المختار:</label>
                    <select id="perfume" required>
                        <option value="1 MILLION">1 MILLION</option>
                        <option value="ULTRA MALE">ULTRA MALE</option>
                        <option value="IMAGINATION LOUIS VUITTON">IMAGINATION LOUIS VUITTON</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>👤 الاسم الكامل:</label>
                    <input type="text" id="name" placeholder="أدخل اسمك الكريم" required>
                </div>

                <div class="form-group">
                    <label>📍 المدينة والعنوان الكامل:</label>
                    <input type="text" id="address" placeholder="مثال: الدار البيضاء، حي المعاريف" required>
                </div>

                <div class="form-group">
                    <label>📦 الكمية المطلوب شراءها:</label>
                    <input type="number" id="quantity" value="1" min="1" required>
                </div>

                <div class="form-group">
                    <label>📝 ملاحظات إضافية (اختياري):</label>
                    <textarea id="notes" rows="2" placeholder="أي تفاصيل خاصة بالتوصيل أو التغليف"></textarea>
                </div>

                <button type="button" class="btn-whatsapp" onclick="sendToWhatsApp()">
                    <span>تأكيد الطلب عبر WhatsApp</span>
                    <span>💬</span>
                </button>
            </form>
        </section>
    </div>

    <script>
        // فتح النافذة المنبثقة للطلب وتحدد العطر مباشرة
        function openOrderModal(productName) {
            document.getElementById('perfume').value = productName;
            document.getElementById('orderModal').classList.add('active');
        }

        // إغلاق نافذة الطلب
        function closeOrderModal() {
            document.getElementById('orderModal').classList.remove('active');
        }

        // إغلاق النافذة عند الضغط خارج المربع
        function closeOnOverlay(event) {
            if (event.target.id === 'orderModal') {
                closeOrderModal();
            }
        }

        // دالة إرسال البيانات للواتساب
        function sendToWhatsApp() {
            const phoneNumber = "212649982831"; 

            const perfume = document.getElementById('perfume').value;
            const name = document.getElementById('name').value;
            const address = document.getElementById('address').value;
            const quantity = document.getElementById('quantity').value;
            const notes = document.getElementById('notes').value;

            if (!name || !address) {
                alert("يرجى إدخال الاسم والعنوان لإكمال الطلب.");
                return;
            }

            let message = `مرحباً A&P AURA PARFUMS، أريد تأكيد طلب جديد:\n\n`;
            message += `👑 *العطر:* ${perfume}\n`;
            message += `🔢 *الكمية:* ${quantity}\n`;
            message += `👤 *الاسم:* ${name}\n`;
            message += `📍 *العنوان:* ${address}\n`;
            if (notes) {
                message += `📝 *ملاحظات:* ${notes}\n`;
            }

            const whatsappUrl = `https://wa.me/${phoneNumber}?text=${encodeURIComponent(message)}`;
            window.open(whatsappUrl, '_blank');
        }
    </script>
</body>
</html>
